<screen>
  <appbar title="Icons"></appbar>

  <label>The set</label>
  <div class="icon-cell" *ngFor="let name of names">
    <icon [name]="name"></icon>
    <span>{{ name }}</span>
  </div>

  <label>In use</label>
  <div class="icon-line">
    <icon name="bell" color="primary"></icon>
    <p>Notifications</p>
  </div>
  <div class="icon-line">
    <icon name="search" size="20"></icon>
    <p>Search your library</p>
  </div>
  <div class="icon-line">
    <icon name="heart" size="28" color="error"></icon>
    <p>Favourites</p>
  </div>
  <div class="icon-line">
    <icon name="sun"></icon>
    <p>Good morning</p>
  </div>

  <label>Icon buttons: the meaningful kind</label>
  <p>An icon button is for one clear action, like Back. It carries a 48 square touch target and no label. If an action needs words, use a button instead.</p>
  <div class="icon-line">
    <icon-button name="chevron-left" (click)="tapIcon('chevron-left')"></icon-button>
    <icon-button name="settings" (click)="tapIcon('settings')"></icon-button>
    <icon-button name="share" (click)="tapIcon('share')"></icon-button>
  </div>
  <p *ngIf="lastTap">Last tapped: {{ lastTap }}</p>
</screen>
