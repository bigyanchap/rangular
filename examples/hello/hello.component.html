<screen>
  <appbar title="Rangular" search="Search"></appbar>
  <h1>{{ title }}</h1>
  <p>{{ subtitle }}</p>
  <card>
    <h2>Simple blocks, polished by default</h2>

  </card>
  <button [disabled]="actionDisabled">Get started</button>
</screen>
