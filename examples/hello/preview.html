<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rangular preview — app-hello</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Roboto, system-ui, sans-serif; background: #e8eaed; display: flex; justify-content: center; padding: 24px 12px; }
  .screen { width: 360px; max-width: 100%; min-height: 640px; background: #ffffff; color: #1f1f1f; border-radius: 28px; overflow: hidden; box-shadow: 0 10px 28px rgba(0,0,0,.18); padding-bottom: 24px; }
  .appbar { display: flex; align-items: center; gap: 12px; margin: 12px; background: #f0f4f9; border-radius: 9999px; padding: 10px 16px; }
  .search { flex: 1; color: #5f6368; font-size: 14px; }
  .appbar-title { flex: 1; font-size: 20px; font-weight: 600; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #7b1fa2; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
  .avatar-lg { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; background: #0b57d0; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; }
  .display { font-size: 32px; line-height: 40px; font-weight: 700; margin: 16px 16px 8px; }
  .heading { font-size: 24px; line-height: 32px; font-weight: 700; margin: 0 0 8px; }
  .title { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0 0 8px; }
  .body { font-size: 16px; line-height: 24px; color: #5f6368; margin: 0 16px 16px; }
  .card { background: #f0f4f9; border: 1px solid #dadce0; border-radius: 16px; padding: 16px; margin: 0 16px 16px; }
  .card .body { margin: 0; font-size: 14px; }
  .btn { display: block; margin: 8px 16px 0; background: #0b57d0; color: #ffffff; border: none; border-radius: 9999px; padding: 0 24px; min-height: 48px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn[disabled] { opacity: .38; cursor: default; }
  .list { border-top: 1px solid #dadce0; }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 16px; border-bottom: 1px solid #dadce0; }
  .row-main { flex: 1; display: flex; flex-direction: column; }
  .row-title { font-weight: 600; font-size: 14px; }
  .row-sub { font-size: 13px; }
  .row-detail { font-size: 12.5px; color: #5f6368; }
  .row-time { font-size: 11px; color: #5f6368; }
  .fab { display: inline-block; float: right; margin: 8px 16px 0 0; background: #c2e7ff; color: #001d35; border-radius: 16px; padding: 13px 18px; font-size: 14px; font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div class="screen"><header class="appbar"><span class="appbar-menu">&#9776;</span><span class="search">Search</span><span class="avatar">R</span></header>
<h1 class="display">Welcome to Rangular</h1>
<p class="body">You wrote Angular. This screen is React Native.</p>
<section class="card"><h2 class="heading">Simple blocks, polished by default</h2>
<p class="body">Every block on this screen compiled to a pre-polished Rangular Material primitive.</p></section>
<button class="btn" >Get started</button></div>
</body>
</html>
