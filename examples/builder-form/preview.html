  body { margin: 0; font-family: Roboto, system-ui, sans-serif; background: #e8eaed; display: flex; flex-direction: column; align-items: center; padding: 24px 12px; }

  .preview-chrome button { background: #ffffff; color: #0b57d0; border: 1px solid #dadce0; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .preview-nav-back { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 16px 0; padding: 8px 12px; border: 1px dashed #b3261e; border-radius: 12px; color: #b3261e; font-size: 12px; background: #ffffff; }

  /* The screen owns the layout grid, mirroring RgScreen: one
     horizontal margin (spacing.lg) as padding, one vertical rhythm
     (spacing.md) as the gap between stacked blocks. Blocks carry no
     horizontal margins of their own, in either renderer. */
  .screen { position: relative; width: 360px; max-width: 100%; min-height: 640px; background: var(--screen-bg); color: var(--text); border-radius: 28px; overflow: hidden; box-shadow: 0 10px 28px rgba(0,0,0,.18); padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px; }
  .appbar { display: flex; align-items: center; gap: 12px; background: var(--surface-variant); border-radius: 9999px; padding: 10px 16px; }
  .search { flex: 1; color: var(--text-muted); font-size: 14px; }
  .appbar-title { flex: 1; font-size: 20px; font-weight: 600; }
  /* Centered app bar title (tutorial round): fixed width side
     zones balance the bar so the title centers truly. */
  .appbar-side { width: 28px; flex: 0 0 28px; display: inline-flex; align-items: center; }
  .appbar-side.end { justify-content: flex-end; }
  .appbar-title.center, .search.center { text-align: center; }
  /* Gradient shell round (2026-11-17): the gradient app bar band,
     the pinned bar, bar children, the gradient surface, labelled
     section heads, the search pill and the row action. The preview
     paints a pinned bar sticky in its scroll frame; the app pins
     it above the scroll through the screen's header slot. Close,
     not identical, and this note is the record. */
  .appbar.gradient { background: linear-gradient(115deg, #0849ad, #0b57d0 52%, #4285f4); border-radius: 0; color: var(--on-primary); }
  .appbar.plain { background: var(--surface); border-radius: 0; box-shadow: 0 1px 4px rgba(0,0,0,.14); }
  .appbar.tint { background: linear-gradient(180deg, var(--role-wash-from), var(--role-wash-via) 55%, var(--role-wash-to)); border-radius: 0; box-shadow: none; }
  .appbar-progress { height: 3px; background: #dadce0; }
  .appbar-progress div { height: 3px; background: var(--primary); }
  .appbar-actions { display: inline-flex; align-items: center; gap: 12px; }
  .row.selected { background: #e8f0fe; border-radius: 16px; }
  .appbar-children.flush { margin-top: 0; }
  .section-chip { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 28px; }
  .pill-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex: 0 0 32px; }
  .pill-lead { display: inline-flex; cursor: pointer; }
  .appbar.pin { position: sticky; top: 0; z-index: 30; }
  .appbar.has-children { flex-direction: column; align-items: stretch; }
  .appbar-row { display: flex; align-items: center; gap: 12px; }
  .appbar-children { margin-top: 8px; }
  .appbar-action { display: inline-flex; }
  .gradient { background: linear-gradient(115deg, #0849ad, #0b57d0 52%, #4285f4); color: var(--on-primary); --text: var(--on-primary); --text-muted: var(--on-primary); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .section-head { display: flex; align-items: center; gap: 8px; }

  .section-title { flex: 1; font-size: 20px; font-weight: 700; }
  .section-meta { font-size: 12px; color: var(--text-muted); }

  .input-search.white { background: var(--role-surface); }
  .input-search input { flex: 1; border: none; background: transparent; font-size: 16px; color: var(--text); padding: 10px 0; outline: none; min-width: 0; }
  .row-action { background: none; border: none; padding: 4px; cursor: pointer; display: inline-flex; align-items: center; }
  /* Code block (tutorial round): a dark editor surface and a
     monospace stack in both themes; long lines scroll sideways. */
  .code { background: var(--role-code-surface); color: var(--role-code-text); border-radius: 12px; padding: 12px 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; line-height: 20px; white-space: pre; overflow-x: auto; margin: 0; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--avatar); color: var(--on-avatar); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
  .avatar-lg { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; }
  .icon { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .icon svg { display: block; }
  .display { font-size: 32px; line-height: 40px; font-weight: 700; margin: 0; }
  .heading { font-size: 24px; line-height: 32px; font-weight: 700; margin: 0; }
  .title { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0; }
  .body { font-size: 16px; line-height: 24px; margin: 0; }
  .label { display: block; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: .4px; margin: 0; }
  .badge { display: inline-block; background: var(--primary-container); color: var(--on-primary-container); border-radius: 9999px; padding: 4px 12px; font-size: 12px; font-weight: 700; }
  .card { background: var(--surface-variant); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .btn { display: block; margin: 0; background: linear-gradient(180deg, var(--primary), var(--role-primary-deep)); color: var(--on-primary); border: none; border-radius: 9999px; padding: 0 24px; min-height: 48px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn[disabled] { opacity: .38; cursor: default; }

  .btn-text.btn-neutral { background: transparent; color: var(--text-muted); }
  .icon-btn { align-self: flex-start; width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: flex-start; background: transparent; border: none; padding: 0; cursor: pointer; }
  .form { display: flex; flex-direction: column; gap: 12px; }
  .tab-panel { display: flex; flex-direction: column; gap: 12px; }
  .step-panel { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin: 12px 0 0; }
  .field-label { font-size: 14px; font-weight: 600; color: var(--text-muted); }
  .field-input { font: inherit; font-size: 16px; color: var(--text); background: var(--role-surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .field-input[disabled] { opacity: .38; }
  .field-error { color: var(--role-error); font-size: 12px; }
  .switch, .checkbox { display: flex; align-items: center; gap: 12px; margin: 8px 0 0; padding: 8px 0; background: transparent; border: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .switch[disabled], .checkbox[disabled], .switcher-option[disabled], .radio-option[disabled] { opacity: .38; cursor: default; }
  .switch-track { position: relative; width: 52px; height: 32px; flex: 0 0 52px; border: 2px solid var(--border); border-radius: 9999px; background: var(--surface-variant); transition: background-color .16s linear, border-color .16s linear; }
  .switch.on .switch-track { background: var(--primary); border-color: var(--primary); }
  .switch.on.success .switch-track { background: var(--role-success); border-color: var(--role-success); }
  .switch-knob { position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: var(--text-muted); transition: left .16s linear, background-color .16s linear; }
  .switch.on .switch-knob { left: 22px; background: var(--on-primary); }
  .control-label { flex: 1; font-size: 14px; }
  .checkbox-box { width: 24px; height: 24px; flex: 0 0 24px; border: 2px solid var(--text-muted); border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--on-primary); }
  .checkbox.on .checkbox-box { background: var(--primary); border-color: var(--primary); }
  .checkbox-mark { font-size: 16px; font-weight: 700; line-height: 1; }
  .switcher { display: flex; gap: 4px; padding: 4px; margin: 8px 0 0; background: var(--surface-variant); border: 1px solid var(--border); border-radius: 9999px; }
  .switcher-option { flex: 1; min-height: 40px; border: none; border-radius: 9999px; background: transparent; color: var(--text); padding: 0 12px; font-size: 14px; cursor: pointer; }
  .switcher-option.selected { background: var(--primary-container); color: var(--on-primary-container); font-weight: 600; }
  .radio-option { display: flex; align-items: center; gap: 12px; margin: 0; padding: 8px 0; background: transparent; border: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .radio-circle { width: 24px; height: 24px; flex: 0 0 24px; border: 2px solid var(--text-muted); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
  .radio-option.selected .radio-circle { border-color: var(--primary); }
  .radio-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }
  .list { border-top: 1px solid var(--border); }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .list > .row:last-child { border-bottom: none; }
  .row-main { flex: 1; display: flex; flex-direction: column; }
  .row-title { font-weight: 600; font-size: 14px; }
  .row-sub { font-size: 13px; }
  .row-detail { font-size: 12.5px; color: var(--text-muted); }
  .row-time { font-size: 11px; color: var(--text-muted); }
  .fab { display: inline-block; align-self: flex-end; margin: 0; background: var(--primary-container); color: var(--on-primary-container); border-radius: 16px; padding: 13px 18px; font-size: 14px; font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  .overlay { position: absolute; inset: 0; z-index: 10; display: flex; align-items: flex-end; }
  .overlay-center { align-items: center; justify-content: center; padding: 0 16px; }
  .overlay-backdrop { position: absolute; inset: 0; background: var(--role-scrim); opacity: .32; }
  .sheet { display: flex; flex-direction: column; gap: 12px; position: relative; width: 100%; background: var(--role-surface); border-radius: 20px 20px 0 0; padding: 8px 16px 24px; box-shadow: 0 -4px 18px rgba(0,0,0,.18); animation: sheet-up .22s linear; max-height: 88%; overflow-y: auto; }
  .sheet .btn, .dialog .btn { width: 100%; }
  .sheet-handle { width: 36px; height: 4px; border-radius: 9999px; background: var(--border); margin: 0 auto 12px; }
  @keyframes sheet-up { from { transform: translateY(24px); } to { transform: translateY(0); } }
  .dialog { display: flex; flex-direction: column; gap: 12px; position: relative; width: 100%; background: var(--role-surface); border-radius: 20px; padding: 20px; box-shadow: 0 10px 28px rgba(0,0,0,.25); animation: dialog-in .15s linear; }
  .dialog-title { font-size: 20px; line-height: 28px; font-weight: 600; margin-bottom: 12px; }
  @keyframes dialog-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 16px; }
  .actions .btn { margin: 0; }
  .picker-box { display: flex; align-items: center; gap: 12px; background: var(--role-surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .picker-value { flex: 1; font-size: 16px; color: var(--text); }
  .picker-head { display: flex; align-items: center; justify-content: space-between; min-height: 32px; margin-bottom: 8px; }
  .picker-head-btn { border: none; background: transparent; color: var(--primary); font: inherit; font-size: 16px; padding: 4px 0; cursor: pointer; }
  .picker-head-done { font-weight: 600; }
  .picker-head-title { font-size: 14px; font-weight: 600; }
  .wheels { display: flex; gap: 4px; position: relative; }
  .wheels::before, .wheels::after { content: ''; position: absolute; left: 0; right: 0; height: 1px; background: var(--text-muted); opacity: .4; z-index: 2; pointer-events: none; }
  .wheels::before { top: 80px; }
  .wheels::after { top: 120px; }
  .wheel { flex: 1; max-height: 200px; overflow-y: auto; padding: 80px 0; box-sizing: border-box; }
  .wheel.wide { flex: 1.6; }
  .wheel-value { display: block; width: 100%; height: 40px; border: none; background: transparent; color: var(--text-muted); font: inherit; font-size: 20px; white-space: nowrap; cursor: pointer; }
  .wheel-value.selected { color: var(--text); font-weight: 600; }
  /* Data display (Stage 11). The badge dot is deliberately its own
     class: .badge above is the older showcase pill. */
  .btn, .row { position: relative; }
  .badge-dot { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; border-radius: 9999px; background: var(--role-error); color: var(--role-on-error); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; z-index: 2; }

  .panel-header { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 0; cursor: pointer; }
  .panel-titles { flex: 1; }
  .panel-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .panel-subtitle { font-size: 12px; color: var(--text-muted); }
  .panel-chevron { display: inline-flex; transform: rotate(90deg); }
  .panel-chevron.open { transform: rotate(-90deg); }
  .panel-body { display: flex; flex-direction: column; gap: 12px; padding: 0 0 16px; }
  .table { margin: 0; }
  .table-row { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .table-cell { flex: 1; font-size: 14px; color: var(--text); }
  .table-cell.head { font-size: 14px; font-weight: 600; color: var(--text-muted); }
  .table-empty { font-size: 14px; color: var(--text-muted); padding: 11px 0; }
  .slider { margin: 0; padding: 12px 0; }
  .slider-track { position: relative; height: 4px; border-radius: 9999px; background: var(--surface-variant); }
  .slider-fill { position: absolute; left: 0; top: 0; height: 4px; border-radius: 9999px; background: var(--primary); }
  .slider-thumb { position: absolute; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: var(--primary); }
  .slider-ticks { position: relative; height: 20px; }
  .slider-tick { position: absolute; top: 6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--border); border: none; cursor: pointer; padding: 0; }
  button.slider-tick { background: var(--primary); opacity: .55; }
  .progress { height: 4px; border-radius: 9999px; background: var(--surface-variant); margin: 8px 0 0; overflow: hidden; }
  .progress-fill { height: 4px; border-radius: 9999px; background: var(--primary); }
  .spinner { display: inline-flex; vertical-align: middle; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-variant); border: 1px solid var(--border); border-radius: 9999px; padding: 6px 12px; font-size: 14px; color: var(--text); }
